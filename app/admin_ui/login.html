<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in</title>
<style>body{margin:0;font-family:system-ui;background:#111827;color:#e5e7eb;display:grid;min-height:100vh;place-items:center}main{width:min(380px,calc(100% - 40px));background:#1f2937;padding:32px;border-radius:12px}h1{margin-top:0}label{display:block;margin-bottom:8px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:7px;border:1px solid #4b5563}button{margin-top:16px;background:#38bdf8;border:0;font-weight:700;color:#082f49}</style></head>
<body><main><h1>Document Admin</h1><p>Sign in with the configured admin API key.</p><form method="post" action="/admin/login"><label for="api_key">Admin API key</label><input id="api_key" name="api_key" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></main></body></html>
